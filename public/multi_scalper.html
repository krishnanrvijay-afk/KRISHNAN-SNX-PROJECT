<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Multi Scalper</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700;800&display=swap');
  :root {
    --bg:      #080c0f;
    --surface: #0d1418;
    --border:  #1a2530;
    --green:   #00e676;
    --yellow:  #ffd740;
    --red:     #ff4444;
    --blue:    #00d4ff;
    --muted:   #6a8898;
    --text:    #e0eef8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 10px; }

  .hdr { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  .hdr-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: #fff; letter-spacing: 1px; }
  .hdr-title span { color: var(--green); }
  .hdr-right { text-align: right; }
  .hdr-clock { font-size: 12px; font-weight: 700; color: var(--yellow); }
  .hdr-session { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 4px; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .session-bar { display: flex; gap: 3px; margin-bottom: 10px; }
  .session-seg { flex: 1; height: 24px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; text-transform: uppercase; }
  .session-seg.active { outline: 2px solid var(--yellow); }

  .blackout { background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3); border-radius: 5px; padding: 8px; margin-bottom: 10px; color: var(--red); font-size: 11px; font-weight: 700; text-align: center; display: none; }

  /* Combined bar */
  .combined { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 12px; }
  .cpill { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 10px; text-align: center; }
  .cpill-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
  .cpill-value { font-size: 16px; font-weight: 700; }

  /* Ticker card */
  .ticker-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .ticker-card.border-wait  { border-color: var(--red) !important; }
  .ticker-card.border-same  { border-color: var(--green) !important; }
  .ticker-card.border-new   { border-color: var(--blue) !important; }
  .ticker-card.border-armed { border-color: var(--yellow) !important; }

  .ticker-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .ticker-name { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; color: #fff; }
  .badge-row { display: flex; gap: 5px; }
  .badge { font-size: 9px; padding: 2px 8px; border-radius: 20px; font-weight: 700; }
  .badge-green  { background: rgba(0,230,118,0.15); color: var(--green); border: 1px solid rgba(0,230,118,0.3); }
  .badge-yellow { background: rgba(255,215,64,0.15); color: var(--yellow); border: 1px solid rgba(255,215,64,0.3); }
  .badge-red    { background: rgba(255,68,68,0.15); color: var(--red); border: 1px solid rgba(255,68,68,0.3); }
  .badge-flat   { background: rgba(106,136,152,0.15); color: var(--muted); border: 1px solid var(--border); }
  .badge-osc    { background: rgba(0,230,118,0.2); color: var(--green); border: 1px solid rgba(0,230,118,0.4); animation: pulse 1.5s ease-in-out infinite; }

  /* Price row */
  .price-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .pstat-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
  .pstat-value { font-size: 16px; font-weight: 700; }

  /* Trade setup box */
  .setup-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 10px; margin-bottom: 10px; }
  .setup-box.armed { border-color: var(--yellow); background: rgba(255,215,64,0.03); }
  .setup-title { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .setup-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .setup-item-label { font-size: 9px; color: var(--muted); text-transform: uppercase; margin-bottom: 3px; }
  .setup-item-value { font-size: 15px; font-weight: 700; }
  .setup-note { font-size: 9px; color: var(--muted); margin-top: 6px; }

  /* Band */
  .band-wrap { position: relative; height: 36px; background: var(--bg); border-radius: 3px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 8px; }
  .band-fill { position: absolute; left: 0; right: 0; }
  .band-fill.active { background: rgba(0,230,118,0.08); border-top: 1px solid rgba(0,230,118,0.4); border-bottom: 1px solid rgba(0,230,118,0.4); }
  .band-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--yellow); }
  .band-lbl-u { position: absolute; right: 6px; top: 2px; font-size: 9px; font-weight: 700; color: var(--green); }
  .band-lbl-l { position: absolute; right: 6px; bottom: 2px; font-size: 9px; font-weight: 700; color: var(--red); }
  .band-lbl-p { position: absolute; left: 6px; font-size: 9px; font-weight: 700; color: var(--yellow); transform: translateY(-50%); }

  /* Trade log */
  .log-section { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; }
  .log-title { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .trade-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 10px; }
  .trade-row:last-child { border-bottom: none; }
  .trade-side { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 2px; min-width: 14px; text-align: center; }
  .trade-side.long { background: rgba(0,230,118,0.15); color: var(--green); }
  .trade-prices { color: var(--muted); flex: 1; }
  .trade-pnl { font-weight: 700; text-align: right; min-width: 72px; }
  .trade-time { color: var(--muted); font-size: 9px; min-width: 34px; text-align: right; }

  .green  { color: var(--green) !important; }
  .yellow { color: var(--yellow) !important; }
  .red    { color: var(--red) !important; }
  .blue   { color: var(--blue) !important; }
  .white  { color: #fff !important; }

  .footer { color: var(--muted); font-size: 9px; padding-top: 8px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .clear-btn { background: rgba(255,68,68,0.15); border: 1px solid rgba(255,68,68,0.3); color: var(--red); padding: 4px 10px; border-radius: 3px; font-family: inherit; font-size: 9px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-title">MULTI<span>.</span>SCALPER</div>
  <div class="hdr-right">
    <div class="hdr-clock"><span class="live-dot"></span><span id="clock">--:--:-- EST</span></div>
    <div class="hdr-session" id="sessionLabel">--</div>
  </div>
</div>

<div class="session-bar" id="sessionBar"></div>
<div class="blackout" id="blackoutBanner">⛔ NY OPEN BLACKOUT 09:00–11:00 EST</div>

<div class="combined">
  <div class="cpill"><div class="cpill-label">Total P&L</div><div class="cpill-value" id="totalPnl">+$0</div></div>
  <div class="cpill"><div class="cpill-label">Win Rate</div><div class="cpill-value" id="totalWr">--</div></div>
  <div class="cpill"><div class="cpill-label">Trades</div><div class="cpill-value" id="totalTrades">0</div></div>
  <div class="cpill"><div class="cpill-label">OSC Windows</div><div class="cpill-value" id="totalOsc">0</div></div>
</div>

<div id="tickerCards"></div>

<div class="footer">
  <span>SNX · FIL · NEAR · 1m · Binance · $1,400 · 100x · $140k · paper</span>
  <button class="clear-btn" onclick="clearAllTrades()">CLEAR TRADES</button>
</div>

<script>
const SYMBOLS    = ['SNXUSDT', 'FILUSDT', 'NEARUSDT'];
const NOTIONAL   = 140000;
const TAKER_FEE  = 0.0002;
const POLL_MS    = 10000;   // 10s for 1m candles
const CANDLE_INT = 'Min1';  // 1m candles
const MIN_CANDLES = 3;
const TICK_WINDOW = 5;
const BLACKOUT_H  = [9, 10];

function todayStartEST() {
  const now = new Date(Date.now() - getEasternOffset() * 3600000);
  return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate())).getTime() + 5 * 3600000;
}

const state = {};
SYMBOLS.forEach(s => {
  state[s] = {
    candles: [], tick: 0.0001,
    inOsc: false, oscUpper: 0, oscLower: 0, oscCount: 0,
    prevOscUpper: 0, prevOscLower: 0, action: 'WAIT',
    openLong: null,
    trades: JSON.parse(localStorage.getItem('mt2_' + s) || '[]'),
    sessionStart: todayStartEST(),
    dayRange: 0, lastPrice: 0,
    lastCandleTs: null
  };
});

function getEasternOffset() {
  // Use EDT (UTC-4) Mar-Nov, EST (UTC-5) Nov-Mar
  const now = new Date();
  const jan = new Date(now.getFullYear(), 0, 1);
  const jul = new Date(now.getFullYear(), 6, 1);
  const stdOffset = Math.max(jan.getTimezoneOffset(), jul.getTimezoneOffset());
  return now.getTimezoneOffset() < stdOffset ? 4 : 5;
}
function nowEST() { return new Date(Date.now() - getEasternOffset() * 3600000); }
function estHour() { return nowEST().getUTCHours(); }
function fmtTime(ms) { return new Date(ms - 5*3600000).toISOString().slice(11,16); }
function inBlackout() { return BLACKOUT_H.includes(estHour()); }
function sessionName(h) {
  if (h < 3) return 'Asia'; if (h < 9) return 'London';
  if (h < 11) return 'NY Open'; if (h < 21) return 'NY Session';
  return 'Late';
}
function fmtPnl(v) { return (v >= 0 ? '+' : '') + '$' + Math.abs(v).toFixed(2); }
function fmtPrice(v, tick) {
  const decimals = tick < 0.001 ? 4 : tick < 0.01 ? 4 : 3;
  return parseFloat(v).toFixed(decimals);
}

async function fetchCandles(symbol, limit) {
  try {
    const r = await fetch('/proxy/mexc/kline?symbol=' + symbol + '&interval=' + CANDLE_INT + '&limit=' + limit);
    const d = await r.json();
    if (!d || !d.success || !d.data || !d.data.time.length) return [];
    const raw = d.data;
    const out = [];
    for (let i = 0; i < raw.time.length; i++) {
      out.push({
        ts:    raw.time[i] * 1000,
        open:  parseFloat(raw.open[i]),
        high:  parseFloat(raw.high[i]),
        low:   parseFloat(raw.low[i]),
        close: parseFloat(raw.close[i])
      });
    }
    return out.sort((a,b) => a.ts - b.ts);
  } catch(e) { return []; }
}

function inferTick(c) {
  const diffs = [];
  for (let i = 1; i < c.length; i++) {
    const d = Math.abs(c[i].close - c[i-1].close);
    if (d > 0) diffs.push(+d.toFixed(7));
  }
  return diffs.length ? Math.min(...diffs) : 0.0001;
}

function detectOsc(candles, tick) {
  if (candles.length < MIN_CANDLES) return null;
  const win = candles.slice(-MIN_CANDLES);
  const wh  = Math.max(...win.map(x => x.high));
  const wl  = Math.min(...win.map(x => x.low));
  return (wh - wl) <= TICK_WINDOW * tick ? { upper: wh, lower: wl } : null;
}

function pnlForRange(upper, lower) {
  return NOTIONAL * (upper - lower) / ((upper + lower) / 2) - 2 * TAKER_FEE * NOTIONAL;
}

// Trade setup levels for manual execution
function getSetup(price, tick) {
  return {
    entry: +(price - tick).toFixed(6),
    tp:    +(price).toFixed(6),
    sl:    +(price - 3 * tick).toFixed(6),
  };
}

function enterTrade(sym, upper, lower, ts) {
  const st = state[sym];
  st.openLong = { entry: lower, target: upper, ts };
}

function closeTrade(sym, exitPrice, reason) {
  const st = state[sym];
  if (!st.openLong) return;
  const t = st.openLong;
  const fees = 2 * TAKER_FEE * NOTIONAL;
  const net  = NOTIONAL * (exitPrice - t.entry) / t.entry - fees;
  st.trades.push({
    sym, entry: t.entry, exit: exitPrice,
    priceAtEntry: st.lastPrice,
    tradeType: st.action === 'SAME_TRADE' ? 'REPEAT' : 'NEW',
    ts: t.ts, tsClose: Date.now(),
    net: +net.toFixed(2),
    outcome: net > 0 ? 'WIN' : 'LOSS', reason
  });
  st.openLong = null;
  localStorage.setItem('mt2_' + sym, JSON.stringify(st.trades));
}

async function processSym(sym) {
  const raw = await fetchCandles(sym, 25);
  if (!raw.length) return;
  const st    = state[sym];
  st.candles  = raw;
  st.tick     = inferTick(raw);
  const last  = raw[raw.length - 1];
  st.lastPrice = last.close;
  const dayHigh = Math.max(...raw.map(c => c.high));
  const dayLow  = Math.min(...raw.map(c => c.low));
  st.dayRange   = (dayHigh - dayLow) / dayLow * 100;

  // Only process each new candle once
  if (last.ts === st.lastCandleTs) return;
  st.lastCandleTs = last.ts;

  const osc = detectOsc(raw, st.tick);

  if (osc && !st.inOsc) {
    // New oscillation detected — set band but dont enter yet
    const isNewBand = st.prevOscLower !== osc.lower || st.prevOscUpper !== osc.upper;
    st.inOsc        = true;
    st.prevOscLower = st.oscLower;
    st.prevOscUpper = st.oscUpper;
    st.oscUpper     = osc.upper;
    st.oscLower     = osc.lower;
    st.oscCount++;
    st.action       = isNewBand && st.prevOscLower > 0 ? 'NEW_SETUP' : 'ARMED';
    // Only enter if price is AT or ABOVE entry — meaning it can dip to fill
    // Don't enter if price already below entry (missed the setup)
    if (last.close >= st.oscLower) {
      st.openLong = { entry: st.oscLower, target: st.oscUpper, ts: last.ts };
    }

  } else if (osc && st.inOsc) {
    // Check if price dipped to entry and filled
    if (!st.openLong && last.close >= st.oscLower) {
      // Re-arm — price back above entry, ready for next dip
      st.openLong = { entry: st.oscLower, target: st.oscUpper, ts: last.ts };
    }

    if (st.openLong) {
      const recentHigh = Math.max(...raw.slice(-3).map(c => c.high));
      const recentLow  = Math.min(...raw.slice(-3).map(c => c.low));

      // Only count as filled if price actually touched entry level
      const wasFilled = recentLow <= st.openLong.entry;

      if (wasFilled && recentHigh >= st.openLong.target) {
        // Full round trip — dipped to entry AND bounced to target
        closeTrade(sym, st.openLong.target, 'TP');
        st.action = 'SAME_TRADE';
        // Re-arm for next bounce if price still above entry
        if (last.close >= st.oscLower) {
          st.openLong = { entry: st.oscLower, target: st.oscUpper, ts: last.ts };
        }
      } else if (wasFilled && recentLow <= st.oscLower - 2 * st.tick) {
        // Filled then hit SL
        closeTrade(sym, st.oscLower - 2 * st.tick, 'SL');
        st.action = 'NO_TRADE';
      }
    }

  } else if (!osc && st.inOsc) {
    st.inOsc = false;
    st.action = 'NO_TRADE';
    if (st.openLong) {
      // Close at market on breakout only if was filled
      closeTrade(sym, last.close, 'BREAK');
    }
  }
}

function renderClock() {
  const t = nowEST();
  const h = String(t.getUTCHours()).padStart(2,'0');
  const m = String(t.getUTCMinutes()).padStart(2,'0');
  const s = String(t.getUTCSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = h+':'+m+':'+s+' EST';
  document.getElementById('sessionLabel').textContent = sessionName(estHour());
}

function renderSession() {
  const sessions = [
    {l:'Asia',  s:0,  e:3,  c:'#1a3a4a'},
    {l:'London',s:3,  e:9,  c:'#1a3a2a'},
    {l:'NYOpen',s:9,  e:11, c:'#3a1a1a'},
    {l:'NY',    s:11, e:21, c:'#1a2a3a'},
    {l:'Late',  s:21, e:24, c:'#1a1a3a'}
  ];
  const h = estHour();
  document.getElementById('sessionBar').innerHTML = sessions.map(s =>
    '<div class="session-seg ' + (h>=s.s&&h<s.e?'active':'') + '" style="background:' + s.c + ';color:' + (h>=s.s&&h<s.e?'#fff':'var(--muted)') + ';flex:' + (s.e-s.s) + '">' + s.l + '</div>'
  ).join('');
  document.getElementById('blackoutBanner').style.display = inBlackout() ? 'block' : 'none';
}

function renderCombined() {
  let net=0, wins=0, count=0, osc=0;
  SYMBOLS.forEach(sym => {
    const st = state[sym];
    const today = st.trades.filter(t => t.ts >= st.sessionStart);
    net   += today.reduce((s,t) => s+t.net, 0);
    wins  += today.filter(t => t.outcome==='WIN').length;
    count += today.length;
    osc   += st.oscCount;
  });
  const el = document.getElementById('totalPnl');
  el.textContent = fmtPnl(net);
  el.style.color = net >= 0 ? 'var(--green)' : 'var(--red)';
  document.getElementById('totalWr').textContent     = count ? Math.round(wins/count*100)+'%' : '--';
  document.getElementById('totalTrades').textContent = count;
  document.getElementById('totalOsc').textContent    = osc;
}

function renderTicker(sym) {
  const st    = state[sym];
  const price = st.lastPrice;
  if (!price) return;

  const today   = st.trades.filter(t => t.ts >= st.sessionStart);
  const net     = today.reduce((s,t) => s+t.net, 0);
  const wins    = today.filter(t => t.outcome==='WIN').length;
  const tot     = today.length;
  const wr      = tot ? Math.round(wins/tot*100)+'%' : '--';

  // Signal class
  let sigClass='', sigBadge='';
  if (st.dayRange < 4)      { sigBadge = '<span class="badge badge-green">GREEN</span>'; }
  else if (st.dayRange < 7) { sigClass='sig-yellow'; sigBadge = '<span class="badge badge-yellow">CAUTION</span>'; }
  else                      { sigClass='sig-red';    sigBadge = '<span class="badge badge-red">AVOID</span>'; }

  const oscBadge = st.inOsc
    ? '<span class="badge badge-osc">OSC ACTIVE</span>'
    : '<span class="badge badge-flat">FLAT</span>';

  // Band
  const upper = st.oscUpper || price + st.tick * 3;
  const lower = st.oscLower || price - st.tick * 3;
  const range = upper - lower || st.tick;
  const pad   = range * 3;
  const total = range + pad * 2;
  const topPct = (1-(upper-lower+pad)/total)*100;
  const htPct  = range/total*100;
  const pPct   = Math.max(2, Math.min(98, (1-(price-(lower-pad))/total)*100));

  // Trade setup for manual execution
  const setup  = getSetup(price, st.tick);
  const isArmed = st.inOsc;
  // Action badge
  let actionHtml = '';
  if (inBlackout()) {
    actionHtml = '<div style="margin-bottom:10px;padding:8px 12px;border-radius:5px;background:rgba(255,68,68,0.1);border:1px solid rgba(255,68,68,0.3);display:flex;justify-content:space-between;align-items:center">' +
      '<span style="color:var(--red);font-weight:700;font-size:12px">🔴 NO TRADE — NY OPEN BLACKOUT</span>' +
      '<span style="color:var(--muted);font-size:10px">Resume 11:00 EST</span>' +
      '</div>';
  } else if (st.action === 'SAME_TRADE' && st.inOsc) {
    actionHtml = '<div style="margin-bottom:10px;padding:8px 12px;border-radius:5px;background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.4);display:flex;justify-content:space-between;align-items:center">' +
      '<span style="color:var(--green);font-weight:700;font-size:12px">🟢 SAME TRADE — Re-enter same levels</span>' +
      '<span style="color:var(--muted);font-size:10px">E:' + fmtPrice(st.oscLower,st.tick) + ' TP:' + fmtPrice(st.oscUpper,st.tick) + '</span>' +
      '</div>';
  } else if (st.action === 'NEW_SETUP' && st.inOsc) {
    actionHtml = '<div style="margin-bottom:10px;padding:8px 12px;border-radius:5px;background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.4);display:flex;justify-content:space-between;align-items:center">' +
      '<span style="color:var(--blue);font-weight:700;font-size:12px">🔵 NEW SETUP — Update your order</span>' +
      '<span style="color:var(--muted);font-size:10px">E:' + fmtPrice(st.oscLower,st.tick) + ' TP:' + fmtPrice(st.oscUpper,st.tick) + '</span>' +
      '</div>';
  } else if (st.action === 'NO_TRADE' || !st.inOsc) {
    actionHtml = '<div style="margin-bottom:10px;padding:8px 12px;border-radius:5px;background:rgba(255,68,68,0.08);border:1px solid rgba(255,68,68,0.2);display:flex;justify-content:space-between;align-items:center">' +
      '<span style="color:var(--red);font-weight:700;font-size:12px">🔴 NO TRADE — Waiting for pattern</span>' +
      '<span style="color:var(--muted);font-size:10px">FLAT</span>' +
      '</div>';
  } else if (st.action === 'ARMED' && st.inOsc) {
    actionHtml = '<div style="margin-bottom:10px;padding:8px 12px;border-radius:5px;background:rgba(255,215,64,0.1);border:1px solid rgba(255,215,64,0.4);display:flex;justify-content:space-between;align-items:center">' +
      '<span style="color:var(--yellow);font-weight:700;font-size:12px">⚡ ARMED — Place limit order now</span>' +
      '<span style="color:var(--muted);font-size:10px">E:' + fmtPrice(st.oscLower,st.tick) + ' TP:' + fmtPrice(st.oscUpper,st.tick) + '</span>' +
      '</div>';
  }
  const setupHtml = '<div class="setup-box ' + (isArmed?'armed':'') + '">' +
    '<div class="setup-title"><span>MEXC LIMIT ORDER SETUP</span><span style="color:' + (isArmed?'var(--yellow)':'var(--muted)') + '">' + (isArmed?'⚡ ARMED':'WATCHING') + '</span></div>' +
    '<div class="setup-grid">' +
      '<div><div class="setup-item-label">Limit Entry</div><div class="setup-item-value yellow">' + fmtPrice(isArmed?st.oscLower:setup.entry, st.tick) + '</div></div>' +
      '<div><div class="setup-item-label">Take Profit</div><div class="setup-item-value green">' + fmtPrice(isArmed?st.oscUpper:setup.tp, st.tick) + '</div></div>' +
      '<div><div class="setup-item-label">Stop Loss</div><div class="setup-item-value red">' + fmtPrice(isArmed?(st.oscLower-2*st.tick):setup.sl, st.tick) + '</div></div>' +
    '</div>' +
    '<div class="setup-note">' + (isArmed ? 'Band: ' + fmtPrice(st.oscLower,st.tick) + ' – ' + fmtPrice(st.oscUpper,st.tick) + ' · ' + Math.round((st.oscUpper-st.oscLower)/st.tick) + ' ticks · proj ' + fmtPnl(pnlForRange(st.oscUpper,st.oscLower)) : 'Watching for oscillation pattern') + '</div>' +
    '</div>';

  // Recent trades
  const recentTrades = [...today].reverse().slice(0,4).map(t => {
    const cls     = t.net >= 0 ? 'green' : 'red';
    const typeCls = t.tradeType === 'REPEAT' ? 'color:var(--green)' : 'color:var(--blue)';
    const typeLabel = t.tradeType === 'REPEAT' ? 'REPEAT' : 'NEW';
    return '<div class="trade-row">' +
      '<span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:2px;' + typeCls + ';border:1px solid currentColor;min-width:42px;text-align:center">' + typeLabel + '</span>' +
      '<span style="color:var(--muted);flex:1;font-size:10px">@' + fmtPrice(t.priceAtEntry || t.entry, st.tick) + '</span>' +
      '<span class="trade-pnl ' + cls + '">' + fmtPnl(t.net) + '</span>' +
      '<span class="trade-time">' + fmtTime(t.ts) + '</span>' +
      '</div>';
  }).join('') || '<div style="color:var(--muted);padding:4px 0">No trades yet today</div>';

  const card = document.getElementById('card_' + sym);
  if (!card) return;
  // Border based on action signal
  let borderClass = '';
  if (inBlackout()) borderClass = 'border-wait';
  else if (st.action === 'SAME_TRADE' && st.inOsc) borderClass = 'border-same';
  else if (st.action === 'NEW_SETUP'   && st.inOsc) borderClass = 'border-new';
  else if (st.action === 'ARMED'       && st.inOsc) borderClass = 'border-armed';
  else borderClass = 'border-wait';
  card.className = 'ticker-card ' + borderClass;
  card.innerHTML =
    '<div class="ticker-hdr">' +
      '<div class="ticker-name">' + sym.replace('USDT','') + '</div>' +
      '<div class="badge-row">' + sigBadge + oscBadge + '</div>' +
    '</div>' +
    '<div class="price-row">' +
      '<div><div class="pstat-label">Price</div><div class="pstat-value blue">' + fmtPrice(price,st.tick) + '</div></div>' +
      '<div><div class="pstat-label">Range</div><div class="pstat-value ' + (st.dayRange<4?'green':st.dayRange<7?'yellow':'red') + '">' + st.dayRange.toFixed(1) + '%</div></div>' +
      '<div><div class="pstat-label">Session P&L</div><div class="pstat-value ' + (net>=0?'green':'red') + '">' + fmtPnl(net) + '</div></div>' +
      '<div><div class="pstat-label">Win Rate</div><div class="pstat-value white">' + wr + ' <span style="font-size:10px;color:var(--muted)">(' + tot + ')</span></div></div>' +
    '</div>' +

    actionHtml +
    setupHtml +
    '<div class="log-section">' +
      '<div class="log-title"><span>Paper Trades — Today</span><span style="color:' + (net>=0?'var(--green)':'var(--red)') + '">' + fmtPnl(net) + '</span></div>' +
      recentTrades +
    '</div>';
}

function buildCards() {
  document.getElementById('tickerCards').innerHTML = SYMBOLS.map(sym =>
    '<div class="ticker-card" id="card_' + sym + '"><div style="color:var(--muted);padding:6px">Loading ' + sym + '...</div></div>'
  ).join('');
}

function clearAllTrades() {
  SYMBOLS.forEach(s => {
    state[s].trades   = [];
    state[s].oscCount = 0;
    state[s].openLong = null;
    state[s].inOsc    = false;
    localStorage.removeItem('mt2_' + s);
  });
  renderCombined();
  SYMBOLS.forEach(renderTicker);
}

async function poll() {
  for (const sym of SYMBOLS) {
    await processSym(sym);
    renderTicker(sym);
  }
  renderCombined();
}

buildCards();
setInterval(renderClock, 1000);
setInterval(renderSession, 60000);
renderClock();
renderSession();
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
